name: Daily investment data

on:
  workflow_dispatch:
    inputs:
      force:
        description: Retry even if today's run was already completed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: screening-daily
  cancel-in-progress: false

jobs:
  update:
    # Enable only after deploying the SQL migration and verifying a manual run.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SQL_RESOURCE_GROUP: ${{ vars.AZURE_SQL_RESOURCE_GROUP }}
      AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
      FIREWALL_RULE: gh-screening-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate required configuration
        env:
          SQL_CONNECTION: ${{ secrets.SCREENING_SQL_CONNECTION_STRING }}
          SEC_AGENT: ${{ secrets.SCREENING_SEC_USER_AGENT }}
          CLIENT_ID: ${{ secrets.SCREENING_AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.SCREENING_AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.SCREENING_AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          for name in SQL_CONNECTION SEC_AGENT CLIENT_ID TENANT_ID SUBSCRIPTION_ID AZURE_SQL_RESOURCE_GROUP AZURE_SQL_SERVER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required setting: $name. See Tools/ScreeningWorker/README.md."
              exit 1
            fi
          done

      - name: Test
        run: dotnet test TradingJournal.Tests/TradingJournal.Tests.csproj --configuration Release --verbosity quiet
      - name: Publish worker
        run: dotnet publish Tools/ScreeningWorker/ScreeningWorker.csproj --configuration Release --output worker --verbosity quiet

      - name: Apply PostgreSQL migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SCREENING_SQL_CONNECTION_STRING }}
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project TradingJournal/TradingJournal.csproj --startup-project TradingJournal/TradingJournal.csproj --context TradingJournal.Data.ApplicationDbContext

      - name: Sign in to Azure using short-lived identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SCREENING_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SCREENING_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SCREENING_AZURE_SUBSCRIPTION_ID }}

      - name: Allow this runner's IP temporarily
        id: firewall
        shell: bash
        run: |
          RUNNER_IP="$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)"
          export RUNNER_IP
          python3 -c 'import os, ipaddress; ipaddress.IPv4Address(os.environ["RUNNER_IP"])'
          az sql server firewall-rule create --resource-group "$AZURE_SQL_RESOURCE_GROUP" --server "$AZURE_SQL_SERVER" --name "$FIREWALL_RULE" --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" --output none

      - name: Check SQL schema and access
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SCREENING_SQL_CONNECTION_STRING }}
          Screening__SecUserAgent: ${{ secrets.SCREENING_SEC_USER_AGENT }}
        run: dotnet worker/ScreeningWorker.dll --check

      - name: Update stocks, macro and insider filings
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SCREENING_SQL_CONNECTION_STRING }}
          Screening__SecUserAgent: ${{ secrets.SCREENING_SEC_USER_AGENT }}
          AlphaVantage__ApiKey: ${{ secrets.SCREENING_ALPHA_VANTAGE_API_KEY }}
          Turso__DatabaseUrl: ${{ secrets.TURSO_DATABASE_URL }}
          Turso__AuthToken: ${{ secrets.TURSO_AUTH_TOKEN }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          if [[ "$FORCE" == 'true' ]]; then
            dotnet worker/ScreeningWorker.dll --run --force
          else
            dotnet worker/ScreeningWorker.dll --run
          fi

      - name: Remove temporary SQL firewall rule
        if: always() && steps.firewall.outcome != 'skipped' && steps.firewall.outcome != ''
        shell: bash
        run: |
          az sql server firewall-rule delete --resource-group "$AZURE_SQL_RESOURCE_GROUP" --server "$AZURE_SQL_SERVER" --name "$FIREWALL_RULE" --output none
