name: Build and deploy .NET Core application to Web App tradingJournal

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tradingJournal
  AZURE_WEBAPP_PACKAGE_PATH: TradingJournal\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: TradingJournal

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"

      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build

      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure WebApp
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Post-deploy readiness check
        shell: pwsh
        run: |
          $baseUrl = "${{ steps.deploy-to-webapp.outputs.webapp-url }}"
          if ([string]::IsNullOrWhiteSpace($baseUrl)) {
            $baseUrl = "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          }

          $readyUrl = "$($baseUrl.TrimEnd('/'))/health/deep"
          $liveUrl = "$($baseUrl.TrimEnd('/'))/health/live"
          $lastError = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Write-Host "Checking $liveUrl (attempt $attempt/12)..."
              $liveResponse = Invoke-WebRequest -Uri $liveUrl -UseBasicParsing -TimeoutSec 30
              Write-Host $liveResponse.Content

              Write-Host "Checking $readyUrl (attempt $attempt/12)..."
              $response = Invoke-WebRequest -Uri $readyUrl -UseBasicParsing -TimeoutSec 30
              Write-Host $response.Content

              if ($response.StatusCode -eq 200) {
                Write-Host "Readiness check passed."
                exit 0
              }

              $lastError = "Unexpected status code: $($response.StatusCode)"
            }
            catch {
              $lastError = $_.Exception.Message

              if ($_.Exception.Response -ne $null) {
                try {
                  $stream = $_.Exception.Response.GetResponseStream()
                  if ($stream -ne $null) {
                    $reader = [System.IO.StreamReader]::new($stream)
                    $body = $reader.ReadToEnd()
                    if (-not [string]::IsNullOrWhiteSpace($body)) {
                      Write-Warning $body
                      $lastError = "$lastError Body: $body"
                    }
                  }
                }
                catch {
                  Write-Warning "Could not read error response body: $($_.Exception.Message)"
                }
              }

              Write-Warning $lastError
            }

            Start-Sleep -Seconds 10
          }

          throw "Readiness check failed after deployment. Last error: $lastError"
